```yaml
spring:
  application:
    name: chat-platform

  profiles:
    default: dev

  main:
    banner-mode: console
    lazy-initialization: false

  jackson:
    time-zone: UTC
    locale: en_US

    serialization:
      indent-output: true
      write-dates-as-timestamps: false

    deserialization:
      fail-on-unknown-properties: false

    default-property-inclusion: non_null

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB

server:
  port: 8080

  servlet:
    context-path: /
    session:
      timeout: 30m

  compression:
    enabled: true

    mime-types:
      - application/json
      - application/xml
      - text/html
      - text/xml
      - text/plain

    min-response-size: 2048

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      show-details: when_authorized

  health:
    diskspace:
      enabled: true

info:
  application:
    name: Chat Platform
    description: Enterprise Chat Platform
    version: 1.0.0
    vendor: MATLA Systems Development

logging:
  file:
    name: logs/application.log

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

  level:
    root: INFO

    org.springframework: INFO

    org.hibernate: WARN

    com.matlasystems.chat: INFO

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /swagger-ui.html

application:

  security:
    password:
      min-length: 8

  upload:
    max-avatar-size: 5242880
    max-attachment-size: 104857600

  websocket:
    endpoint: /ws

  pagination:
    default-page-size: 20
    max-page-size: 100

  timezone: UTC
```
