spring:
  config:
    activate:
      on-profile: dev

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat_platform}
    username: ${DB_USERNAME:chatuser}
    password: ${DB_PASSWORD:password}

    hikari:
      pool-name: ChatPlatformPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 60000

  jpa: 
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        show_sql: false
        jdbc:
          time_zone: UTC
        generate_statistics: false

  sql:
    init:
      mode: never

  jackson:
    serialization:
      indent-output: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 25MB

  web:
    resources:
      add-mappings: false

server:
  port: 8080

  servlet:
    context-path: /

    session:
      timeout: 30m
  
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - env
          - loggers

  endpoint:
    health:
      show-details: always


logging:
  level:
    root: INFO

    org.springframework: INFO

    org.springframework.security: DEBUG

    org.hibernate.SQL: DEBUG

    org.hibernate.orm.jdbc.bind: TRACE

    com.matlasystems.chat: DEBUG

  file:
    name: logs/chat-platform-dev.log

  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 30

app:

  environment: development

  cors:

    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173

    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - PATCH
      - OPTIONS

    allowed-headers:
      - "*"

  storage:

    upload-directory: uploads

    avatar-directory: uploads/avatars

    attachment-directory: uploads/atttachments

    temporary-directory: uploads/temp

  websocket:

    endpoint: /ws

    heartbeat-interval: 30000

    message-size-limit: 65536

  security:

    jwt:

      access-token-expiration: 900

      refresh-token-expiration: 604800

  mail:

    enabled: false

  cache:

    enabled: false

  feature-flags:

    registration-enabled: true
    
    email-verification-enabled: false

    websocket-enabled: true

    swagger-enabled: true


